<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$</title>
  <link rel="stylesheet" href="/klyn.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1 class="page-title">$title$</h1>
      <form class="search-form search-form--compact" id="search" action="/search.html" method="get">
        <input type="search" name="q" placeholder="Search" aria-label="Search" autocomplete="off">
      </form>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" role="switch" aria-checked="false">
        <span class="sun-icon" aria-hidden="true">☀️</span>
        <span class="moon-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>
  <main class="container">
    <article class="content" data-pagefind-body>
$if(toc)$
      <details class="toc">
        <summary>On this page</summary>
$toc$
      </details>
$endif$
$body$
    </article>
  </main>
  <script src="/site.js"></script>
</body>
</html>
