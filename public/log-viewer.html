<!DOCTYPE html>
<html>
<head>
<title>Log: none</title>
<meta charset="UTF-8">
<style>

html, body {
  margin: 0;
  height: 100%;
  overflow-y: hidden
}

div.log {
  font-family: Courier New;
  font-size: 12px;
}

div.log {
  white-space: nowrap;
  padding: 0.5em;
  padding-top: 5em;
}

div.lhl {
  background-color: #ffd;
}
div.thread {
  background: #fdd;
}

div.toolbar {
  background-color: white;
  border-bottom: 1px solid #000;
  position: fixed;
  top: 0px;
  left: 0px;
  padding: 4px;
  width: 100%;
  display: block;
}

.persistents,
div.hint {
  display: inline;
  cursor: pointer;
}

div.hint {
  font-family: Arial;
  font-size: 12px;
  padding: 2px;
  margin: 1px;
  color: gray;
  font-style: italic;
}

div.button,
div.button2,
div.button_right {
  display: inline;
  font-weight: bold;
  font-family: Arial;
  font-size: 12px;
  padding: 2px;
  cursor: pointer;
  color: #3ad;
  _text-decoration: underline;
}

div.button2 {
  border: solid 1px gray;
  border-radius: 4px;
  color: black;
  text-decoration: none;
}

div.button2.active {
  background-color: #3ad;
  border-color: #3ad;
  color: white;
}

.chip {
  display: inline-block;
  font-family: Arial;
  font-size: 12px;
  padding: 1px 2px;
  margin: 0 2px;
  border-radius: 3px;
  border: 1px solid transparent;
  vertical-align: middle;
  user-select: none;
}
.chip.filtering {
  border-color: #000;
  font-weight: bold;
}
.chip-label {
  cursor: pointer;
  padding: 0 3px;
}
.chip-merge,
.chip-remove {
  cursor: pointer;
  padding: 0 3px;
  color: rgba(0, 0, 0, 0.5);
  font-weight: bold;
}
.chip-merge { display: none; }
body.has-search .chip-merge { display: inline; }
.chip-merge:hover { color: #060; }
.chip-remove:hover { color: #c00; }

div.button_right {
  margin-right: 1em;
  float: right;
}

div.nounder {
  text-decoration: none;
}

input.filebtn {
  float: right;
  position: relative;
}

div.source {
  display: inline-block;
  font-family: Arial;
  font-size: 12px;
  padding: 2px;
  margin-right: 1em;
  float: right;
  color: #777;
  max-width: 40em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: middle;
}

div.source a {
  color: #3ad;
  text-decoration: none;
}

</style>
<script>

var threadregexp = /(?:^| - )(\[[^\]]*\]):/;

var colors = ["#ffa", "#aaf", "#afa", "#aff", "#faf", "#aaa", "#fd8", "#f80", "#4df", "#4fc", "#76973c", "#7e56d8", "#99593d", "#37778a", "#4068fc"];
var screenlines = 1;

var file = null;
var sourceURL = null;
var text;

var nextFilterId = 1;
var shl = null;
var hl = [];
var filterswitch = true;

var selectedlineid = -1;
var selectedthread = null;
var reachedbottom = false;
var reachedtop = false;

function openfileif(filebtn)
{
  if (!("files" in filebtn))
    return;
  if (filebtn.files.length == 0)
    return;
  file = filebtn.files[0];
  sourceURL = null;

  var u = new URL(window.location.href);
  if (u.searchParams.has("from")) {
    u.searchParams.delete("from");
    history.replaceState(null, "", u.toString());
  }

  reload();
}

function openurl(url)
{
  sourceURL = url;
  file = null;
  var filebtn = document.getElementById("file");
  if (filebtn) filebtn.value = "";

  reload();
}

function wheelscroll(event)
{
  renderincremental(event.deltaY);
}

function keypress(event)
{
  if (event.key == "PageDown") {
    _render(screenlines - 1);
    event.preventDefault();
  }
  if (event.key == "PageUp") {
    _render(-(screenlines - 1));
    event.preventDefault();
  }
  if (event.key == "Home" && event.ctrlKey) {
    selectedlineid = 0;
    render();
    event.preventDefault();
  }
  if (event.key == "End" && event.ctrlKey) {
    selectedlineid = text.length - 1;
    render();
    event.preventDefault();
  }
  if (event.key == "ArrowUp") {
    renderincremental(-1);
    event.preventDefault();
  }
  if (event.key == "ArrowDown") {
    renderincremental(1);
    event.preventDefault();
  }
}

function load()
{
  document.addEventListener("wheel", wheelscroll, false);
  document.addEventListener("keypress", keypress, false);
  window.addEventListener("resize", resize, false);

  _resize();

  var s = document.getElementById("search");
  s.value = "";
  s.addEventListener("input", onSearchInput, false);

  var params = new URLSearchParams(window.location.search);
  var from = params.get("from");
  if (from) {
    openurl(from);
  } else {
    openfileif(document.getElementById("file"));
  }
}

function _resize()
{
  var d = document.getElementById("renderer");
  var t = document.getElementById("toolbar");
  screenlines = Math.floor((window.innerHeight - t.offsetHeight) / d.firstChild.offsetHeight) - 1;
}

function resize()
{
  _resize();
  repaint();
}

function reload()
{
  if (shl) shl.cache = {};
  for (_hl of hl) _hl.cache = {};

  if (sourceURL) {
    _loadviaurl(sourceURL);
  } else if (file) {
    _loadviafile(file);
  } else {
    document.title = "Log: none loaded";
    _setsourcedisplay(null);
    var d = document.getElementById("renderer");
    d.innerHTML = "<div>nothing loaded</div>";
  }
}

function _loadviafile(f)
{
  document.title = "Log: " + f.name;
  _setsourcedisplay({ type: 'file', value: f.name });

  var d = document.getElementById("renderer");
  d.innerHTML = "loading " + f.name + "...";

  var r = new FileReader();
  r.onload = function() {
    console.log("prepare");
    prepare(r.result);
    if (selectedlineid > text.length) {
      selectedlineid = -1;
    }
    console.log("render");
    render();
  };
  r.onerror = function() {
    d.innerHTML = "error reading file: " + (r.error && r.error.message ? r.error.message : "unknown");
  };
  r.readAsText(f);
}

function _loadviaurl(url)
{
  document.title = "Log: " + url;
  _setsourcedisplay({ type: 'url', value: url });

  var d = document.getElementById("renderer");
  d.innerHTML = "loading " + url + "...";

  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
      return r.text();
    })
    .then(function(t) {
      console.log("prepare");
      prepare(t);
      if (selectedlineid > text.length) {
        selectedlineid = -1;
      }
      console.log("render");
      render();
    })
    .catch(function(err) {
      d.innerHTML = "error loading " + url + ": " + err.message;
    });
}

function _setsourcedisplay(src)
{
  var el = document.getElementById("source");
  if (!el) return;

  el.innerHTML = "";
  el.title = "";
  if (!src) return;

  if (src.type === 'url') {
    el.appendChild(document.createTextNode("from URL: "));
    var a = document.createElement("a");
    a.href = src.value;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = src.value;
    el.appendChild(a);
  } else {
    el.textContent = "from file: " + src.value;
  }
  el.title = src.value;
}

function _sanitize(t)
{
  t = t
    .replace(/&/g, "&amp;")
    .replace(/ /g, "&nbsp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  return t;
}

function _prepare(t)
{
  // sanitization happens in render, since otherwise it eats enormous amount of memory.
  /*
  var t = t.split('\n');
  for (var i in t) {
    t[i] = _sanitize(t[i]);
  }
  return t;
  */
  return /*_sanitize*/(t).split('\n');
}

function prepare(t)
{
  text = _prepare(t);
}

function render()
{
  _render(0, false); // completely redraws the view from the current scroll position
}

function repaint()
{
  _render(0, true); // completely redraws the view, but centers the selected line
}

function renderincremental(difference)
{
  _render(difference);  // "scrolls" the view
}

function _render(increment, repaintonly)
{
  var d = document.getElementById("renderer");
  var filter = _gfilteron();
  
  function process(i, append)
  {
    var t = _sanitize(text[i]);

    var lhl = false;
    function dohl(_hl)
    {
      if (_hl.cache[i] === false) {
        // lhl is here unaffected
        return t;
      }

      var t2 = t.replace(new RegExp("(" + _hl.text_r + ")", "g"), "<span style='background-color:" + _hl.color + ";'>$1</span>");
      var affecting = (t != t2);
      _hl.cache[i] = affecting;
      lhl = lhl || (affecting && (!filter || _hl.filter));
      return t2;
    }

    for (var h in hl)
      t = dohl(hl[h]);
    if (shl)
      t = dohl(shl);

    if (filter && !lhl && i != selectedlineid) {
      return false;
    }

    lhl = lhl && !filter;
    var div = document.createElement("div");
    div.id = i;
    if (lhl) div.className = 'lhl';
    div.onclick = function() { selectline(this); };
    div.innerHTML = t;
    if (t.match(new RegExp(selectedthread, "g"))) div.className += ' thread';

    if (append)
      d.appendChild(div);
    else
      d.insertBefore(div, d.firstChild);

    return true;
  }

  var lefttodraw = Math.floor(Math.abs(increment));

  if (increment < 0) {
    // scroll up
    reachedbottom = false;
    if (reachedtop) {
      _hint("reached top of the file");
      return;
    }
    for (var i = parseInt(d.firstChild.id) - 1; lefttodraw && i >= 0 && i < text.length; --i) {
      if (process(i, false)) {
        --lefttodraw;
        if (d.childNodes.length > screenlines)
          d.removeChild(d.lastChild);
      }
    }
    if (lefttodraw) {
      _hint("reached top of the file");
      reachedtop = true;
    }
  } else if (increment > 0) {
    // scroll down
    reachedtop = false;
    if (reachedbottom) {
      _hint("reached bottom of the file");
      return;
    }
    for (var i = parseInt(d.lastChild.id) + 1; lefttodraw && i < text.length; ++i) {
      if (process(i, true)) {
        --lefttodraw;
        if (d.childNodes.length > screenlines)
          d.removeChild(d.firstChild);
      }
    }
    if (lefttodraw) {
      _hint("reached bottom of the file");
      reachedbottom = true;
    }
  } else { // == 0
    // redraw all
    reachedbottom = false;
    reachedtop = false;
    lefttodraw = screenlines;
    var i = repaintonly ? parseInt(d.firstChild.id) : selectedlineid;
    if (i < 0) i = 0;

    d.innerHTML = "";
    for (; lefttodraw && i < text.length; ++i) {
      if (process(i, true)) {
        --lefttodraw;
      }
    }

    if (!repaintonly && selectedlineid > -1) {
      // center the selected line in the middle of screen!
      _render(-(screenlines / 2));
    }
  }

  selectline(selectedlineid);
  
  var pos = document.getElementById("position");
  pos.textContent = Math.round((parseInt(d.firstChild.id) / text.length) * 1000) / 10 + "%";
}

function _hint(h)
{
  document.getElementById("hint").innerHTML = h;
}

function _gfilteron()
{
  if (!filterswitch)
    return false;

  if (shl && shl.filter)
    return true;

  for (var h in hl)
  {
    if (hl[h].filter)
      return true;
  }

  return false;
}

function _triminput(t)
{
  t = t
    .replace(/^\s+/, "")
    .replace(/\s+$/, "")
  ;
  return t;
}

function _regexpescape(t)
{
  t = t
    .replace(/\\/g, "\\\\")
    .replace(/\?/g, "\\?")
    .replace(/\./g, "\\.")
    .replace(/\+/g, "\\+")
    .replace(/\*/g, "\\*")
    .replace(/\^/g, "\\^")
    .replace(/\$/g, "\\$")
    .replace(/\(/g, "\\(")
    .replace(/\)/g, "\\)")
    .replace(/\[/g, "\\[")
    .replace(/\]/g, "\\]")
    .replace(/\|/g, "\\|")
  ;
  return t;
}

function resetuistate()
{
  _hint("");
}

var _searchDebounce = null;
function onSearchInput()
{
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(function() {
    applySearch();
    repaint();
  }, 120);
}

function applySearch()
{
  var s = document.getElementById("search");
  var t = _triminput(s.value);
  if (!t) {
    shl = null;
    s.style.backgroundColor = "";
  } else {
    t = _prepare(t)[0];
    shl = newhl(t, shl);
    s.style.backgroundColor = shl.color;
  }
  _updateSearchFilterButton();
  document.body.classList.toggle("has-search", !!shl);
}

function _updateSearchFilterButton()
{
  var btn = document.getElementById("search-filter-toggle");
  if (!btn) return;
  if (shl && shl.filter) btn.classList.add("active");
  else btn.classList.remove("active");
}

function toggleSearchFilter()
{
  resetuistate();
  if (!shl) applySearch();
  if (!shl) {
    _hint("type something to search first");
    return;
  }
  shl.filter = !shl.filter;
  _updateSearchFilterButton();
  render();
}

function pin()
{
  resetuistate();
  if (!shl) applySearch();
  if (!shl) {
    _hint("type something to search first");
    return;
  }

  var _hl = newhl(shl.text, shl, true);
  _hl.cache = shl.cache;
  hl.push(_hl);

  _renderChip(_hl);

  document.getElementById("search").value = "";
  colors.push(colors.shift());
  shl = null;
  document.getElementById("search").style.backgroundColor = "";
  _updateSearchFilterButton();
  document.body.classList.remove("has-search");
  render();
}

function _renderChip(_hl)
{
  var p = document.getElementById("persistents");
  var chip = document.createElement("span");
  chip.id = "chip" + _hl.id;
  chip.className = "chip" + (_hl.filter ? " filtering" : "");
  chip.style.backgroundColor = _hl.color;

  var label = document.createElement("span");
  label.className = "chip-label";
  label.textContent = _hl.text;
  label.title = "click to toggle filter mode (show only matching lines)";
  label.onclick = function() { toggleChipFilter(_hl.id); };
  chip.appendChild(label);

  var merge = document.createElement("span");
  merge.className = "chip-merge";
  merge.textContent = "+";
  merge.title = "merge current search into this filter";
  merge.onclick = function() { mergeIntoChip(_hl.id); };
  chip.appendChild(merge);

  var rm = document.createElement("span");
  rm.className = "chip-remove";
  rm.textContent = "×";
  rm.title = "remove this filter";
  rm.onclick = function() { removeChip(_hl.id); };
  chip.appendChild(rm);

  p.appendChild(chip);
}

function _findChip(id)
{
  for (var i = 0; i < hl.length; i++)
    if (hl[i].id == id) return hl[i];
  return null;
}

function toggleChipFilter(id)
{
  resetuistate();
  var _hl = _findChip(id);
  if (!_hl) return;
  _hl.filter = !_hl.filter;
  var chip = document.getElementById("chip" + id);
  if (chip) chip.classList.toggle("filtering", _hl.filter);
  render();
}

function mergeIntoChip(id)
{
  resetuistate();
  if (!shl) applySearch();
  if (!shl) {
    _hint("type something to search first");
    return;
  }
  var _hl = _findChip(id);
  if (!_hl) return;

  _hl.text_r += "|" + shl.text_r;
  _hl.text = _hl.text + "+" + shl.text;
  _hl.cache = {};

  var chip = document.getElementById("chip" + id);
  if (chip) {
    var label = chip.querySelector(".chip-label");
    if (label) label.textContent = _hl.text;
  }

  document.getElementById("search").value = "";
  shl = null;
  document.getElementById("search").style.backgroundColor = "";
  _updateSearchFilterButton();
  document.body.classList.remove("has-search");
  render();
}

function removeChip(id)
{
  resetuistate();
  for (var i = 0; i < hl.length; i++) {
    if (hl[i].id == id) { hl.splice(i, 1); break; }
  }
  var chip = document.getElementById("chip" + id);
  if (chip) chip.parentNode.removeChild(chip);
  render();
}

function newhl(t, p, persistent)
{
  return {
    id: persistent ? nextFilterId++ : 0,
    text: t,
    text_r: _sanitize(_regexpescape(t)),
    color: p ? p.color : colors[0],
    filter: p ? p.filter : false,
    cache: {}
  };
}

function selectline(id)
{
  var l0 = document.getElementById(selectedlineid);
  if (l0)
    l0.style.backgroundColor = "";

  var l1 = null;
  if (typeof(id) == "object") {
    l1 = id;
    id = parseInt(l1.id);
  } else {
    l1 = document.getElementById(id);
  }

  selectedlineid = id;
  if (selectedlineid > -1)
    _hint("line # " + (selectedlineid + 1));

  if (l1) {
    l1.style.background = "#faa";
  }

  var thread = null;
  if (selectedlineid >= 0 && selectedlineid < text.length) {
    var m = text[selectedlineid].match(threadregexp);
    if (m) thread = _regexpescape(_sanitize(m[1]));
  }
  if (thread != selectedthread) {
    selectedthread = thread;
    repaint();
  }

  return l1;
}

function mouseup(event)
{
  if (event.ctrlKey)
    return;

  resetuistate();

  var s = window.getSelection();
  var t = _triminput(s.toString());
  if (!t)
    return;

  var sb = document.getElementById("search");
  sb.value = t;
  applySearch();
  repaint();
}

function flipfilter(event)
{
  filterswitch = !filterswitch;
  event.target.innerHTML = (filterswitch ? "filters on" : "filters off");
  render();

  event.stopPropagation();
}

</script>
</head>
<body onload="load()">
<div id="toolbar" class="toolbar">
  <input class="search" id="search" type="search" placeholder="search the log..." />
  <div class="button2" id="search-filter-toggle" onclick="toggleSearchFilter()" title="toggle filter mode for current search (show only matching lines)">filter</div>
  <div class="button2" onclick="pin()" title="pin current search as a persistent filter chip">pin</div>
  <span class="persistents" id="persistents"></span>
  <div class="hint" onclick="repaint()" id="hint"></div>
  <div class="hint" onclick="repaint()" id="position"></div>
  <input type="file" class="filebtn" id="file" onchange="openfileif(this);"/>
  <div class="button_right" onclick="reload()" title="reload this file">reload</div>
  <div class="button_right" onclick="flipfilter(event)" title="enable/disable all filters (master switch)">filters on</div>
  <div class="source" id="source"></div>
</div>
<div id="renderer" class="log" onmouseup="mouseup(event)"><div>nothing loaded</div></div>
</body>
</html>
